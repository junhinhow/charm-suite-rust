# Configuração do cargo-release (https://github.com/crate-ci/cargo-release).
#
# Uso (dry-run por padrão):  cargo release minor
# Executar de verdade:       cargo release minor --execute
#
# ADIADO: a publicação no crates.io está adiada (decisão do mantenedor).
# Por enquanto a instalação é via git, com a tag v0.1.0 (ver docs/INSTALL.md).
# Para habilitar: crie a conta/token do crates.io, defina CARGO_REGISTRY_TOKEN
# e publique com scripts/release.sh (ou scripts/release.ps1), que respeita a
# ordem de dependência. Só depois, se quiser que o cargo-release também publique,
# mude publish = true. Ver CONTRIBUTING.md.

# Todos os crates compartilham a mesma versão (version.workspace = true).
shared-version = true

# Um único commit de release, em vez de um por crate.
consolidate-commits = true

# Tag com prefixo "v", ex.: v0.1.0.
tag-prefix = "v"

# Publicação manual, na ordem de dependência (scripts/release.sh).
publish = false

# Não envia commits nem tags ao remoto automaticamente.
push = false

[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1
