[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://forgejo.multiservidores.com.br/ajr/CharmSuite-Rust"
homepage = "https://forgejo.multiservidores.com.br/ajr/CharmSuite-Rust"
authors = ["Junhinhow <junhinhow@users.noreply.github.com>"]
keywords = ["tui", "terminal", "charm", "cli", "lipgloss"]
categories = ["command-line-interface"]
readme = "README.md"

[workspace.dependencies]
# --- styling ---
lipgloss = "0.1"
# --- runtime (Elm Architecture) ---
charmed-bubbletea = { package = "charmed-bubbletea", version = "0.2" }
# --- cor ---
palette = "0.7"
# --- texto / unicode ---
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-bidi = "0.3"
strip-ansi-escapes = "0.2"
# --- serializacao ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
# --- cli ---
clap = { version = "4", features = ["derive"] }
csv = "1"
# --- erros ---
thiserror = "2"
anyhow = "1"
# --- macros ---
proc-macro2 = "1"
quote = "1"
syn = "2"
# --- testes ---
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
serial_test = "4"
criterion = "0.5"
# --- interno ---
charm-core = { path = "crates/charm-core", version = "0.1.0" }
charm-parity = { path = "tools/parity", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
doc_markdown = "allow"
inline_always = "allow"
unnecessary_wraps = "allow"
default_trait_access = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
