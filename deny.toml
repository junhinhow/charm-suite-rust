[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "warn"
# Transitive, sem atualizacao segura disponivel no ecossistema atual:
# - proc-macro-error2 via charmed-bubbletea-macros (macros do charmed-bubbletea)
# - unsafe-libyaml via serde_yaml_ng (charm-form)
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 transitivo via charmed-bubbletea-macros; sem upgrade seguro" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml transitivo via serde_yaml_ng; sem upgrade seguro" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
