[package]
name = "charm-devtools"
description = "Development inspector for TUI applications: message history, current state, and component trees."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["devtools", "inspector", "debug", "tui", "charm"]
categories = ["development-tools::debugging"]
readme = "README.md"

[dependencies]
charmed-bubbletea.workspace = true
charm-core.workspace = true
lipgloss.workspace = true
charm-devtools-macros = { path = "../charm-devtools-macros", version = "0.1.0", optional = true }

[features]
derive = ["dep:charm-devtools-macros"]

[[example]]
name = "charm_devtools_derive_demo"
required-features = ["derive"]

[dev-dependencies]
charm-parity = { path = "../../tools/parity" }

[lints]
workspace = true
