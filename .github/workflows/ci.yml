name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  metadata:
    name: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verifica os campos obrigatorios de cada crate publicavel
        run: |
          set -e
          for manifest in crates/*/Cargo.toml tools/*/Cargo.toml; do
            pkg=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -1)
            [ "$pkg" = "charm-parity" ] && continue
            echo "::group::$pkg"
            for field in description license repository readme; do
              grep -qE "^$field(\.workspace)? =" "$manifest" \
                || { echo "campo '$field' ausente em $manifest"; exit 1; }
            done
            cargo package --list -p "$pkg" --allow-dirty > /dev/null
            echo "::endgroup::"
          done
      - name: Carga o workspace com todas as features
        run: cargo build --workspace --all-features
